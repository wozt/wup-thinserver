include:
  file: trixie-minbase.yaml

device:
  layer: rpi4
  hostname: wup-thinserver-pi4
  user1: admin
  user1sudo: none

image:
  layer: image-rpios
  boot_part_size: 256M
  root_part_size: 8G
  name: wup-thinserver-pi4-arm64

layer:
  admin: device-user-admin
  thinserver: wup-thinserver
  iwd: iwd

ssh:
  pubkey_user1: $(cat ${@SRCROOT}/admin-key.pub)
  pubkey_only: n

