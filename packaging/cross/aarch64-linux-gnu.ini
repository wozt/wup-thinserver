# Meson cross file: Debian 13 arm64 via the aarch64-linux-gnu toolchain.
# Used by scripts/build-arm64.sh — see docs/BUILD.md (ARM64 section).
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
# shims provided by scripts/build-arm64.sh: plain `cc`/`uname` resolve to
# the cross toolchain so vendored build scripts (libwupstream host/build.sh)
# also cross-compile.
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'pkg-config'