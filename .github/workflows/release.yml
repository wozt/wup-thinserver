name: release

# Builds every release artifact on push to main and publishes the next
# incremental vX.Y.Z.N GitHub release (see tools/publish_release.py for
# versioning and retention). Personal Wi-Fi credentials are NEVER used here:
# Pi images ship without baked Wi-Fi and rely on wup-firstboot.conf /
# Raspberry Pi Imager cloud-init customization (see release/README.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  # A new push supersedes a running build: cancel it. (If a regression is
  # suspected, re-run the cancelled workflow manually.)
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wozt/wup-thinserver

jobs:
  # ------------------------------------------------------------------
  # Change detection: diff against the previous release and flag which
  # artifact families actually need a rebuild. Anything not flagged is
  # carried over from the previous release's assets (same bits).
  # ------------------------------------------------------------------
  detect:
    name: detect-changes
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.diff.outputs.native }}
      docker: ${{ steps.diff.outputs.docker }}
      pi_debian: ${{ steps.diff.outputs.pi_debian }}
      pi_pios: ${{ steps.diff.outputs.pi_pios }}
      prev_tag: ${{ steps.diff.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true
          PREV="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

          native=false; docker=false; pi_debian=false; pi_pios=false
          if [ -z "$PREV" ]; then
            # No previous release: build everything once.
            native=docker=pi_debian=pi_pios=true
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          else
            BASE="$(git rev-parse "$PREV^{commit}" 2>/dev/null || git rev-parse HEAD~1)"
          fi
          echo "diff base: $BASE"
          git diff --name-only "$BASE" HEAD | tee /tmp/changed.txt

          while IFS= read -r f; do
            case "$f" in
              # Packaging scripts shape the native zip/deb/AppImage bits
              # only — the docker image and Pi images don't use them.
              scripts/package-*.sh)
                native=true ;;
              # Everything that lands in the installed payload: the daemon
              # sources, build files, shipped data/config and session helpers.
              src/*|meson.build|tools/build_wupstream_dep.py|data/*|config/*|provisioning/*|\
              scripts/onboard-*|scripts/install-desktop-shortcut.sh|\
              scripts/migrate-settings.py|scripts/wup-set-password.sh|\
              scripts/gamepad-devd.sh|scripts/prepare-native-camera.sh|\
              scripts/install-native.sh|scripts/build-arm64.sh|scripts/build-native-arm64.sh)
                native=true; docker=true; pi_debian=true; pi_pios=true ;;
              docker/*)
                docker=true ;;
              images/raspberry-pi/*|scripts/build-rpi-image.sh)
                pi_debian=true ;;
              images/raspios/*|scripts/build-pios-image.sh)
                pi_pios=true ;;
              *) ;;   # docs, tests, release/, tools/, workflow: no rebuild
            esac
          done < /tmp/changed.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            native=docker=pi_debian=pi_pios=true
          fi
          {
            echo "native=$native"; echo "docker=$docker"
            echo "pi_debian=$pi_debian"; echo "pi_pios=$pi_pios"
          } >> "$GITHUB_OUTPUT"
          echo "rebuild: native=$native docker=$docker pi_debian=$pi_debian pi_pios=$pi_pios"

  # ------------------------------------------------------------------
  # Native Linux artifacts: zip bundle, .deb, AppImage — one job per arch,
  # each inside a native Debian 13 (trixie) container for env parity.
  # ------------------------------------------------------------------
  native:
    name: native-${{ matrix.arch }}
    needs: detect
    if: needs.detect.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            deb_arch: amd64
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(python3 tools/publish_release.py --next-tag)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building artifacts for $TAG"

      - name: Build packages (zip, deb, AppImage)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e TAG -e DEB_ARCH \
            -e LINUXDEPLOY=/src/build/linuxdeploy.AppImage \
            debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq $(grep -v "^#" provisioning/packages/build.txt | grep -v "^$") \
                zip dpkg-dev file curl ca-certificates \
                libgdk-pixbuf2.0-bin librsvg2-common
              export PATH="/usr/sbin:/sbin:$PATH"
              mkdir -p build/dist
              scripts/package-native.sh "$DEB_ARCH" "$TAG" build/dist
              scripts/package-deb.sh    "$DEB_ARCH" "$TAG" build/dist
              case "$(uname -m)" in aarch64) LDARCH=aarch64 ;; *) LDARCH=x86_64 ;; esac
              curl -fL -o build/linuxdeploy.AppImage \
                "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$LDARCH.AppImage"
              chmod +x build/linuxdeploy.AppImage
              APPIMAGE_EXTRACT_AND_RUN=1 scripts/package-appimage.sh "$TAG" build/dist
            '

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Docker image, multi-arch (amd64 + arm64) via buildx.
  # ------------------------------------------------------------------
  docker:
    name: docker-image
    needs: detect
    if: needs.detect.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Debian 13 Pi images (rpi-image-gen), built natively on arm64 runners
  # inside a privileged Debian container (mount namespaces required).
  # ------------------------------------------------------------------
  pi-debian:
    name: pi-debian-$PROFILE
    needs: detect
    if: needs.detect.outputs.pi_debian == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        profile: [pi4, zero2w]
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.profile }} image
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          docker run --rm --privileged \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive -e PROFILE \
            debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq $(grep -v "^#" provisioning/packages/build.txt | grep -v "^$") \
                git curl ca-certificates \
                qemu-user qemu-user-static binfmt-support
              git clone --depth 1 --branch v2.8.0 \
                https://github.com/raspberrypi/rpi-image-gen.git \
                build/rpi-image-gen/source
              bash build/rpi-image-gen/source/install_deps.sh
              export PATH="/usr/sbin:/sbin:$PATH"
              scripts/build-rpi-image.sh "$PROFILE"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: pi-debian-${{ matrix.profile }}
          path: |
            build/images/wup-thinserver-${{ matrix.profile }}-arm64.img.xz
            build/images/wup-thinserver-${{ matrix.profile }}-arm64.img.xz.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Raspberry Pi OS (Trixie) images (pi-gen), same privileged container.
  # ------------------------------------------------------------------
  pi-pios:
    name: pi-pios-$PROFILE
    needs: detect
    if: needs.detect.outputs.pi_pios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        profile: [pi4, zero2w]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space for pi-gen work dirs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build ${{ matrix.profile }} Raspberry Pi OS image
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          docker run --rm --privileged \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive -e PROFILE \
            debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq $(grep -v "^#" provisioning/packages/build.txt | grep -v "^$") \
                quilt parted debootstrap zerofree zip dosfstools e2fsprogs \
                libcap2-bin rsync xz-utils curl xxd file kmod bc gpg pigz \
                arch-test qemu-user qemu-user-static git ca-certificates
              export PATH="/usr/sbin:/sbin:$PATH"
              scripts/build-pios-image.sh "$PROFILE"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: pi-pios-${{ matrix.profile }}
          path: |
            build/images/wup-thinserver-pios-${{ matrix.profile }}-arm64.img.xz
            build/images/wup-thinserver-pios-${{ matrix.profile }}-arm64.img.xz.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Release: alias the docker tag, render the compose file, publish.
  # ------------------------------------------------------------------
  release:
    name: publish-release
    needs: [detect, native, docker, pi-debian, pi-pios]
    # Skipped build jobs report 'skipped', which is fine; a real failure or
    # a cancellation must not publish an incomplete release.
    if: >-
      always() && needs.detect.result == 'success' &&
      !contains(needs.native.result + ',' + needs.docker.result + ',' +
                needs['pi-debian'].result + ',' + needs['pi-pios'].result, 'failure') &&
      !contains(needs.native.result + ',' + needs.docker.result + ',' +
                needs['pi-debian'].result + ',' + needs['pi-pios'].result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute tag and carry over unchanged assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE: ${{ needs.detect.outputs.native }}
          DOCKER: ${{ needs.detect.outputs.docker }}
          PI_DEBIAN: ${{ needs.detect.outputs.pi_debian }}
          PI_PIOS: ${{ needs.detect.outputs.pi_pios }}
          PREV_TAG: ${{ needs.detect.outputs.prev_tag }}
        run: |
          set -euo pipefail
          TAG="$(python3 tools/publish_release.py --next-tag)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV_TAG"

          # Components that were not rebuilt reuse the previous release's
          # assets verbatim (identical inputs -> identical bits). Fresh
          # artifacts win on name collisions (cp -n below).
          mkdir -p dist prev
          if [ -n "$PREV_TAG" ]; then
            pats=()
            [ "$NATIVE" != "true" ] && pats+=(
              -p 'wup-thinserver-*-amd64.zip' -p 'wup-thinserver-*-amd64.deb'
              -p 'wup-thinserver-*-amd64.AppImage'
              -p 'wup-thinserver-*-arm64.zip' -p 'wup-thinserver-*-arm64.deb'
              -p 'wup-thinserver-*-arm64.AppImage')
            [ "$PI_DEBIAN" != "true" ] && pats+=(
              -p 'wup-thinserver-pi[0-9]*-arm64.img.xz'
              -p 'wup-thinserver-[!p]*-arm64.img.xz')
            [ "$PI_PIOS" != "true" ] && pats+=(
              -p 'wup-thinserver-pios-*-arm64.img.xz')
            if [ "${#pats[@]}" -gt 0 ]; then
              gh release download "$PREV_TAG" "${pats[@]}" -D prev --clobber
              cp -rn prev/. dist/
              rm -rf prev
            fi
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias docker image, render compose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          DOCKER: ${{ needs.detect.outputs.docker }}
          PREV_TAG: ${{ needs.detect.outputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ "$DOCKER" = "true" ]; then
            docker buildx imagetools create \
              -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          elif [ -n "$PREV_TAG" ]; then
            # Image unchanged: point the new release tag at the previous
            # release's image bits.
            docker buildx imagetools create \
              -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$PREV_TAG"
          fi

          sed "s|__WUP_IMAGE__|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG|" \
            release/docker-compose.yml > dist/docker-compose.yml
          cp release/docker-compose.camera.yml dist/
          cp release/README.md dist/README.md

          # Buildx drops a *.dockerbuild record artifact; never publish it.
          # Per-file .sha256 sidecars are redundant: SHA256SUMS covers all.
          rm -f dist/*.dockerbuild dist/*.sha256

          # One combined checksum file for every release asset.
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/publish_release.py dist
